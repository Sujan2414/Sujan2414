<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sujan S Dandgulkar — Data Engineer and full-stack developer, Bengaluru">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b2a22"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f6f55" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <style>
      .orb { animation: drift 14s ease-in-out infinite; }
      .orb2 { animation: drift 18s ease-in-out infinite reverse; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .rise { opacity: 0; animation: rise 0.9s ease-out 0.15s forwards; }
      .rise2 { opacity: 0; animation: rise 0.9s ease-out 0.45s forwards; }
      .rise3 { opacity: 0; animation: rise 0.9s ease-out 0.75s forwards; }
      @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,-18px); } }
      @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .swap-a { animation: swapA 10s ease-in-out infinite; }
      .swap-b { opacity: 0; animation: swapB 10s ease-in-out infinite; }
      @keyframes swapA { 0%,42% { opacity: 1; } 46%,96% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes swapB { 0%,46% { opacity: 0; } 50%,92% { opacity: 1; } 96%,100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .orb, .orb2, .cursor { animation: none; } .rise, .rise2, .rise3 { animation: none; opacity: 1; } .swap-a { animation: none; opacity: 0; } .swap-b { animation: none; opacity: 1; } }
      text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace; }
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <circle class="orb" cx="980" cy="70" r="190" fill="url(#glow)"/>
  <circle class="orb2" cx="160" cy="280" r="150" fill="url(#glow)" opacity="0.6"/>

  <g class="rise">
    <text x="80" y="112" font-size="20" fill="#6ee7b7" class="mono">~/bengaluru $ whoami</text>
  </g>
  <g class="rise2">
    <text x="78" y="178" font-size="62" font-weight="800" fill="url(#ink)" letter-spacing="-1">Sujan S Dandgulkar</text>
  </g>
  <g class="rise3">
    <g class="swap-a">
      <text x="80" y="226" font-size="24" fill="#d1fae5" fill-opacity="0.85">Full-stack developer · web apps, mobile apps &amp; AI automation</text>
      <rect class="cursor" x="746" y="206" width="12" height="26" rx="2" fill="#34d399"/>
    </g>
    <g class="swap-b">
      <text x="80" y="226" font-size="24" fill="#d1fae5" fill-opacity="0.85">Data Engineer · ETL pipelines, warehouses &amp; analytics</text>
      <rect class="cursor" x="653" y="206" width="12" height="26" rx="2" fill="#34d399"/>
    </g>
  </g>

  <g transform="translate(1000 150)" opacity="0.9">
    <rect x="-70" y="-70" width="140" height="140" rx="28" fill="#0d1117" stroke="#34d399" stroke-opacity="0.5"/>
    <g fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"><ellipse cx="0" cy="-26" rx="34" ry="12"/><path d="M-34 -26v52c0 6.6 15.2 12 34 12s34-5.4 34-12v-52"/><path d="M-34 0c0 6.6 15.2 12 34 12s34-5.4 34-12"/></g>
  </g>
</svg>
